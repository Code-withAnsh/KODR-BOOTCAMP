name: Deploy Day 14 Mini E-commerce

on:
  push:
    branches:
      - main
    paths:
      - "Day 14 mini e-commerce/**"
      - ".github/workflows/deploy.yml"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: "Day 14 mini e-commerce/package-lock.json"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        working-directory: "Day 14 mini e-commerce"
        run: npm ci

      - name: Build application
        working-directory: "Day 14 mini e-commerce"
        run: npm run build

      - name: Upload Day 14 application
        uses: actions/upload-pages-artifact@v4
        with:
          path: "./Day 14 mini e-commerce/dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
